<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoWynajem — Prototyp UI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-dark: #13151a;
  --bg-mid: #1a1d24;
  --bg-card: #22262e;
  --bg-input: #2a303a;
  --bg-hover: #333842;
  --accent: #3b82f6;
  --accent-dk: #2563eb;
  --accent-glow: rgba(59,130,246,0.15);
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --purple: #a78bfa;
  --teal: #14b8a6;
  --text1: #f1f5f9;
  --text2: #94a3b8;
  --text3: #64748b;
  --text4: #475569;
  --border: #2e3340;
  --border-light: #3a404a;
  --font: 'DM Sans', system-ui, -apple-system, sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --sidebar-w: 230px;
  --transition: 0.2s ease;
}

html, body {
  font-family: var(--font);
  background: #0c0d10;
  color: var(--text1);
  height: 100%;
  overflow: hidden;
}

/* ==================== APP FRAME ==================== */
.app-frame {
  width: 100%;
  max-width: 1400px;
  height: 100vh;
  max-height: 860px;
  margin: 0 auto;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 0;
}

@media (min-height: 900px) {
  .app-frame {
    margin-top: 20px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    height: calc(100vh - 40px);
  }
}

/* ==================== SCREEN MANAGEMENT ==================== */
.screen { display: none; height: 100%; }
.screen.active { display: flex; }

/* ==================== LOGIN SCREEN ==================== */
.login-screen { display: flex; height: 100%; }

.login-brand {
  width: 300px;
  background: linear-gradient(165deg, #1e3a5f 0%, #0f1b2d 50%, #0a1628 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  position: relative;
  overflow: hidden;
}

.login-brand::before {
  content: '';
  position: absolute;
  width: 400px; height: 400px;
  border: 1px solid rgba(59,130,246,0.06);
  border-radius: 50%;
  top: -120px; left: -100px;
  animation: pulse-ring 8s ease-in-out infinite;
}

.login-brand::after {
  content: '';
  position: absolute;
  width: 250px; height: 250px;
  border: 1px solid rgba(59,130,246,0.04);
  border-radius: 50%;
  bottom: -60px; right: -80px;
  animation: pulse-ring 8s ease-in-out infinite 4s;
}

@keyframes pulse-ring {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 1; }
}

.brand-logo {
  width: 72px; height: 72px;
  border-radius: 18px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
  margin-bottom: 20px;
  position: relative; z-index: 1;
  box-shadow: 0 8px 32px rgba(59,130,246,0.3);
}

.brand-name {
  font-size: 24px; font-weight: 700;
  color: #fff;
  position: relative; z-index: 1;
  letter-spacing: -0.5px;
}

.brand-sub {
  font-size: 10px; color: rgba(255,255,255,0.35);
  margin-top: 6px;
  font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase;
  position: relative; z-index: 1;
}

.brand-version {
  position: relative; z-index: 1;
  margin-top: 28px;
  background: rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 6px 16px;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
}

.login-form-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 60px;
  position: relative;
}

.login-close {
  position: absolute; top: 12px; right: 16px;
  width: 32px; height: 32px;
  border: none; background: none;
  color: var(--text3); font-size: 16px;
  cursor: pointer; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}

.login-close:hover { background: var(--bg-hover); color: var(--text1); }

.login-form { max-width: 360px; }
.login-form h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.login-form .hint { font-size: 13px; color: var(--text3); margin-bottom: 32px; line-height: 1.5; }

.field { margin-bottom: 20px; }
.field label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text3); letter-spacing: 0.8px;
  text-transform: uppercase; margin-bottom: 7px;
}

.field input {
  width: 100%; height: 44px;
  background: var(--bg-input);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 0 16px;
  color: var(--text1); font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.field input::placeholder { color: var(--text4); }

.error-box {
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 8px;
  padding: 11px 14px;
  margin-bottom: 18px;
  display: none;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--red);
  animation: shake 0.4s ease;
}

.error-box.show { display: flex; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

.btn-login {
  width: 100%; height: 46px;
  background: var(--accent);
  color: #fff; border: none;
  border-radius: 8px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  transition: background 0.2s, transform 0.1s;
  margin-top: 8px;
}

.btn-login:hover { background: var(--accent-dk); }
.btn-login:active { transform: scale(0.98); }

.demo-hint {
  font-size: 11px; color: var(--text4);
  text-align: center;
  margin-top: 24px;
}

/* ==================== APP SHELL ==================== */
.app-shell { display: flex; width: 100%; height: 100%; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-mid);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  flex-shrink: 0;
}

.sb-header {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 8px;
  margin-bottom: 16px;
}

.sb-logo {
  width: 34px; height: 34px;
  border-radius: 9px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}

.sb-brand { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.sb-brand-sub { font-size: 10px; color: var(--text3); margin-top: -1px; }

.sb-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 8px 8px;
}

.sb-section {
  font-size: 9px; font-weight: 700;
  color: var(--text4);
  padding: 8px 14px 5px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }

.sb-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
  font-weight: 500;
  transition: all 0.15s;
  border: none;
  background: none;
  text-align: left;
  font-family: var(--font);
  width: 100%;
}

.sb-btn:hover { background: var(--bg-hover); color: var(--text1); }
.sb-btn.active { background: var(--bg-card); color: var(--accent); font-weight: 600; }
.sb-btn .ico { width: 20px; text-align: center; font-size: 14px; }

.sb-footer {
  margin-top: auto;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sb-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg-hover);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  color: var(--accent);
  flex-shrink: 0;
}

.sb-uname { font-size: 12px; font-weight: 600; }
.sb-urole { font-size: 10px; color: var(--text3); }

.sb-logout {
  margin-left: auto;
  background: none; border: none;
  color: var(--text3); font-size: 16px;
  cursor: pointer; padding: 4px;
  border-radius: 4px;
  transition: var(--transition);
}

.sb-logout:hover { color: var(--text1); background: var(--bg-hover); }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  background: var(--bg-dark);
}

.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }

/* ==================== SHARED COMPONENTS ==================== */
.page-head { margin-bottom: 20px; }
.page-head-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.page-sub { font-size: 13px; color: var(--text3); margin-top: 3px; }

.btn-sm {
  height: 36px; padding: 0 18px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-family: var(--font);
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}

.btn-sm:hover { background: var(--bg-hover); color: var(--text1); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-accent:hover { background: var(--accent-dk); color: #fff; }
.btn-green { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover { background: #1aab51; color: #fff; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}

.toolbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: flex; gap: 10px; align-items: center;
  margin-bottom: 14px;
}

.toolbar-input {
  flex: 1; height: 38px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 14px;
  color: var(--text1); font-size: 13px;
  font-family: var(--font); outline: none;
  transition: border 0.2s;
}

.toolbar-input:focus { border-color: var(--accent); }
.toolbar-input::placeholder { color: var(--text4); }

.toolbar-select {
  height: 38px; min-width: 140px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  color: var(--text2); font-size: 13px;
  font-family: var(--font); outline: none;
  appearance: none; -webkit-appearance: none;
  cursor: pointer;
}

/* Stats cards */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}

.stat-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

.stat-icon {
  width: 34px; height: 34px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

.stat-label {
  font-size: 10px; font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-val { font-size: 26px; font-weight: 700; }
.stat-aux { font-size: 14px; color: var(--text3); margin-left: 4px; font-weight: 400; }

/* Data tables */
.section-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.section-head {
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.section-title { font-size: 14px; font-weight: 600; }

.badge {
  font-size: 11px; font-weight: 600;
  padding: 3px 10px;
  border-radius: 10px;
  display: inline-block;
}

.badge-blue { background: rgba(59,130,246,0.12); color: var(--accent); }
.badge-green { background: rgba(34,197,94,0.12); color: var(--green); }
.badge-amber { background: rgba(245,158,11,0.12); color: var(--amber); }
.badge-red { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-gray { background: rgba(100,116,139,0.12); color: var(--text3); }

table.data { width: 100%; border-collapse: collapse; font-size: 12px; }

table.data th {
  text-align: left;
  padding: 10px 16px;
  color: var(--text3);
  font-weight: 600;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  background: var(--bg-mid);
}

table.data td {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  color: var(--text2);
}

table.data tr { transition: background 0.1s; }
table.data tbody tr:hover td { background: rgba(255,255,255,0.015); }

.td-bold { color: var(--text1) !important; font-weight: 500; }
.td-mono { font-family: 'DM Sans', monospace; font-size: 12px; letter-spacing: 0.3px; }

/* Alerts */
.alert-item {
  background: var(--bg-input);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  transition: border-color 0.2s;
}

.alert-item:hover { border-color: var(--border-light); }
.alert-title { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.alert-msg { font-size: 11px; color: var(--text2); line-height: 1.4; }
.alert-time { font-size: 10px; color: var(--text4); margin-top: 4px; }

/* Report cards */
.report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

.report-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  transition: border-color 0.2s, transform 0.2s;
}

.report-card:hover { border-color: var(--border-light); transform: translateY(-2px); }

.report-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  margin-bottom: 16px;
}

.report-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.report-desc { font-size: 12px; color: var(--text2); line-height: 1.5; margin-bottom: 16px; }

/* Settings */
.settings-group {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
}

.settings-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }

.settings-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.settings-title { font-size: 15px; font-weight: 600; }
.settings-sub { font-size: 11px; color: var(--text3); }

.settings-sep { height: 1px; background: var(--border); margin-bottom: 18px; }

.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.s-field label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text3); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.4px;
}

.s-field input {
  width: 100%; height: 40px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 14px;
  color: var(--text1); font-size: 13px;
  font-family: var(--font); outline: none;
  transition: border 0.2s;
}

.s-field input:focus { border-color: var(--accent); }

.info-row { display: flex; padding: 7px 0; font-size: 13px; }
.info-label { color: var(--text3); width: 150px; flex-shrink: 0; }

/* Animations */
.fade-in { animation: fadeIn 0.35s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.stagger > * {
  opacity: 0;
  animation: fadeIn 0.35s ease forwards;
}

.stagger > *:nth-child(1) { animation-delay: 0ms; }
.stagger > *:nth-child(2) { animation-delay: 60ms; }
.stagger > *:nth-child(3) { animation-delay: 120ms; }
.stagger > *:nth-child(4) { animation-delay: 180ms; }
.stagger > *:nth-child(5) { animation-delay: 240ms; }

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app-frame">
  <!-- ==================== LOGIN ==================== -->
  <div class="screen active" id="screen-login">
    <div class="login-screen">
      <div class="login-brand">
        <div class="brand-logo">🚗</div>
        <div class="brand-name">AutoWynajem</div>
        <div class="brand-sub">System zarządzania flotą</div>
        <div class="brand-version">v1.0.0-beta</div>
      </div>
      <div class="login-form-area">
        <button class="login-close" title="Zamknij">✕</button>
        <div class="login-form">
          <h1>Zaloguj się</h1>
          <p class="hint">Wprowadź dane konta, aby uzyskać dostęp do systemu</p>
          <div class="error-box" id="login-error">⚠ Nieprawidłowy login lub hasło</div>
          <div class="field">
            <label>Login</label>
            <input type="text" id="inp-user" placeholder="Nazwa użytkownika" value="admin" autocomplete="off">
          </div>
          <div class="field">
            <label>Hasło</label>
            <input type="password" id="inp-pass" placeholder="Wprowadź hasło" value="Admin123!">
          </div>
          <button class="btn-login" id="btn-login">Zaloguj się</button>
          <div class="demo-hint">Demo: admin / Admin123!</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== DASHBOARD ==================== -->
  <div class="screen" id="screen-dashboard"><div class="app-shell" id="shell-dashboard"></div></div>
  <div class="screen" id="screen-fleet"><div class="app-shell" id="shell-fleet"></div></div>
  <div class="screen" id="screen-customers"><div class="app-shell" id="shell-customers"></div></div>
  <div class="screen" id="screen-rentals"><div class="app-shell" id="shell-rentals"></div></div>
  <div class="screen" id="screen-reports"><div class="app-shell" id="shell-reports"></div></div>
  <div class="screen" id="screen-settings"><div class="app-shell" id="shell-settings"></div></div>
</div>

<script>
const NAV = [
  { ico: '📊', label: 'Pulpit', key: 'dashboard' },
  { ico: '🚘', label: 'Flota pojazdów', key: 'fleet' },
  { ico: '👥', label: 'Klienci', key: 'customers' },
  { ico: '📋', label: 'Wypożyczenia', key: 'rentals' },
  { ico: '📈', label: 'Raporty', key: 'reports' },
  { ico: '⚙️', label: 'Ustawienia', key: 'settings' },
];

function sidebar(activeKey) {
  return `<div class="sidebar">
    <div class="sb-header">
      <div class="sb-logo">🚗</div>
      <div><div class="sb-brand">AutoWynajem</div><div class="sb-brand-sub">Panel zarządzania</div></div>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-section">Menu główne</div>
    <div class="sb-nav">
      ${NAV.slice(0,4).map(n => `<button class="sb-btn${n.key===activeKey?' active':''}" onclick="go('${n.key}')"><span class="ico">${n.ico}</span>${n.label}</button>`).join('')}
      <div class="sb-divider" style="margin:6px 4px"></div>
      <div class="sb-section">Administracja</div>
      ${NAV.slice(4).map(n => `<button class="sb-btn${n.key===activeKey?' active':''}" onclick="go('${n.key}')"><span class="ico">${n.ico}</span>${n.label}</button>`).join('')}
    </div>
    <div class="sb-footer">
      <div class="sb-avatar">AS</div>
      <div style="flex:1;min-width:0"><div class="sb-uname">Admin Systemu</div><div class="sb-urole">Administrator</div></div>
      <button class="sb-logout" onclick="go('login')" title="Wyloguj">↪</button>
    </div>
  </div>`;
}

function buildShells() {
  // Dashboard
  document.getElementById('shell-dashboard').innerHTML = sidebar('dashboard') + `<div class="content fade-in">

function populateFleet() {
  const tbody = document.getElementById('fleet-tbody');
  const search = (document.getElementById('fleet-search')?.value || '').toLowerCase();
  const filter = document.getElementById('fleet-filter')?.value || 'Wszystkie';

  let rows = FLEET;
  if (filter !== 'Wszystkie') rows = rows.filter(r => STATUS_MAP[r[8]] === filter);
  if (search) rows = rows.filter(r => r.slice(0,5).some(c => c.toLowerCase().includes(search)));

  tbody.innerHTML = rows.map(r => `<tr>
    <td class="td-bold">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td>
    <td class="td-mono">${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td>
    <td>${r[6]}</td><td>${r[7]} km</td>
    <td><span class="badge ${STATUS_BADGE[r[8]]}">${STATUS_MAP[r[8]]}</span></td>
    <td>${r[9]}</td></tr>`).join('');
}

// Navigation
function go(key) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + key).classList.add('active');

  if (key !== 'login') {
    const c = document.querySelector('#screen-' + key + ' .content');
    if (c) { c.classList.remove('fade-in'); void c.offsetWidth; c.classList.add('fade-in'); }
  }
}

// Login
document.getElementById('btn-login').addEventListener('click', function() {
  const u = document.getElementById('inp-user').value;
  const p = document.getElementById('inp-pass').value;
  const btn = this;

  if (u === 'admin' && p === 'Admin123!') {
    document.getElementById('login-error').classList.remove('show');
    btn.innerHTML = '<span class="spinner"></span> Logowanie...';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = 'Zaloguj się';
      btn.disabled = false;
      go('dashboard');
    }, 800);
  } else {
    document.getElementById('login-error').classList.add('show');
  }
});

// Enter key on login
document.querySelectorAll('#inp-user, #inp-pass').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });
  el.addEventListener('input', () => document.getElementById('login-error').classList.remove('show'));
});
